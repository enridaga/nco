name: Build documentation

on:
  push:
    branches: [main]
    paths:
      - "v*/ontology.ttl"
      - "build/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r build/requirements.txt
          curl -sSL -o robot.jar https://github.com/ontodev/robot/releases/download/v1.9.11/robot.jar

      - name: Build
        run: python build/build.py --robot robot.jar

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html v*/index.html v*/index-en.html v*/ontology.omn
          git diff --cached --quiet || git commit -m "Rebuild documentation"
          git push
